function eadDraw(){if(page!=='cursos')return;const completed=eadCourses.filter(x=>eadPercent(x.id)===100).length;const running=eadCourses.filter(x=>eadPercent(x.id)>0&&eadPercent(x.id)<100).length;const notStarted=eadCourses.length-completed-running;

function removeItem(id){if(!editing())return;if(confirm('Excluir este item fictício?')){db[adminTab]=db[adminTab].filter(x=>x.id!==id);save();render()}}function resetDemo(){if(confirm('Restaurar todos os dados fictícios?')){db=JSON.parse(JSON.stringify(seed));save();render()}}function modal(html){document.getElementById('modal-root').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}function closeModal(){document.getElementById('modal-root').innerHTML=''}let carouselIndex=0,carouselTimer=null;function showSlide(i){const root=document.getElementById('hero-carousel');if(!root)return;const slides=[...root.querySelectorAll('.slide')],dots=[...root.querySelectorAll('.dot')];carouselIndex=(i+slides.length)%slides.length;slides.forEach((e,n)=>e.classList.toggle('current',n===carouselIndex));dots.forEach((e,n)=>{e.classList.toggle('active',n===carouselIndex);e.setAttribute('aria-current',n===carouselIndex?'true':'false')})}function moveSlide(n){showSlide(carouselIndex+n);restartCarousel()}function restartCarousel(){clearInterval(carouselTimer);if(document.getElementById('hero-carousel'))carouselTimer=setInterval(()=>showSlide(carouselIndex+1),3000)}window.showSlide=showSlide;window.moveSlide=moveSlide;document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInterval(carouselTimer);else if(page==='home')restartCarousel()});function setupCarousel(){clearInterval(carouselTimer);carouselIndex=0;const root=document.getElementById('hero-carousel');if(!root)return;root.addEventListener('mouseenter',()=>clearInterval(carouselTimer));root.addEventListener('mouseleave',restartCarousel);root.addEventListener('focusin',()=>clearInterval(carouselTimer));root.addEventListener('focusout',restartCarousel);restartCarousel()}
